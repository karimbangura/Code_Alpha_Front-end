<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="webpage">
  <meta property="description" content="photo gallery">
  <title>Photo Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <h1>Photo Gallery</h1>
    <p>Pick a category, then open any photo to step through the set.</p>
  </header>

  <nav class="filters" aria-label="Filter photos by category">
    <button class="filter is-active" type="button" data-filter="all">All <span class="count"></span></button>
    <button class="filter" type="button" data-filter="nature">Nature <span class="count"></span></button>
    <button class="filter" type="button" data-filter="city">City <span class="count"></span></button>
    <button class="filter" type="button" data-filter="animals">Animals <span class="count"></span></button>
    <button class="filter" type="button" data-filter="technology">Technology <span class="count"></span></button>
  </nav>

  <p class="status" id="status" aria-live="polite"></p>

  <main class="grid" id="grid">
    <!-- Nature -->
    <button class="card" type="button" data-category="nature">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXXDdY3PZrL3LFjDWFXrcMzwn035zdxd346kztTx6yW22gxOITL0GMjjk&s=10" alt="Swedish Nature" loading="lazy">
      <span class="cap">Swedish Nature</span>
    </button>
    <button class="card" type="button" data-category="nature">
      <img src="https://images.stockcake.com/public/1/c/c/1cc9ac01-a4f8-4490-8443-a7921c1572f6_large/serene-waterfall-garden-stockcake.jpg" alt="Serene waterfall garden" loading="lazy">
      <span class="cap">Serene waterfall garden</span>
    </button>
    <button class="card" type="button" data-category="nature">
      <img src="https://img.magnific.com/premium-photo/3d-render-beautiful-arabian-desert-with-warm-gold-colors-sunset_926199-2284650.jpg?w=360" alt="Arabian Desert" loading="lazy">
      <span class="cap">Arabian Desert</span>
    </button>

    <!-- City -->
    <button class="card" type="button" data-category="city">
      <img src="https://i.guim.co.uk/img/media/36daaefbd22bdf742ff8696be703746f23c657a5/0_80_6493_3897/master/6493.jpg?width=1200&height=900&quality=85&auto=format&fit=crop&s=ff4fbfaa7be8888267537c20d309ab45" alt="Tokyo City" loading="lazy">
      <span class="cap">Tokyo City</span>
    </button>
    <button class="card" type="button" data-category="city">
      <img src="https://neocha-content.oss-cn-hongkong.aliyuncs.com/wp-content/uploads/sites/2/2016/06/Market_48011.jpg" alt="Night market street" loading="lazy">
      <span class="cap">Night market street</span>
    </button>
    <button class="card" type="button" data-category="city">
      <img src="https://cdn.praguecitytourism.city/2024/03/13144058/0M1A8439-2.jpg" alt="Old town tram" loading="lazy">
      <span class="cap">Old town tram</span>
    </button>

    <!-- Animals -->
    <button class="card" type="button" data-category="animals">
      <img src="https://i0.wp.com/www.roeselienraimond.com/wp-content/uploads/2025/09/fox_with-reflection-in-water-fine-art.webp?resize=900%2C600&ssl=1" alt="Red fox" loading="lazy">
      <span class="cap">Red fox</span>
    </button>
    <button class="card" type="button" data-category="animals">
      <img src="https://www.aquariumofpacific.org/images/made_new/images-report_card-Great_Blue_Heron_1270_400_q85.jpg" alt="Heron" loading="lazy">
      <span class="cap">Heron</span>
    </button>
    <button class="card" type="button" data-category="animals">
      <img src="https://d2zp5xs5cp8zlg.cloudfront.net/image-85229-800.jpg" alt="Cat asleep" loading="lazy">
      <span class="cap">Cat asleep</span>
    </button>

    <!-- Technology -->
    <button class="card" type="button" data-category="technology">
      <img src="https://images.stockcake.com/public/3/e/8/3e83452c-6b60-479a-9161-56d0ddecf7a7_large/electronic-circuit-closeup-stockcake.jpg" alt="Circuit board" loading="lazy">
      <span class="cap">Circuit board</span>
    </button>
    <button class="card" type="button" data-category="technology">
      <img src="https://images.stockcake.com/public/1/9/5/1950914f-2a8e-4a84-b9f3-a5a1dda4e862_medium/data-center-glow-stockcake.jpg" alt="Server room corridor" loading="lazy">
      <span class="cap">Server room corridor</span>
    </button>
    <button class="card" type="button" data-category="technology">
      <img src="https://media.yourobserver.com/img/photos/2025/10/04/Boston_Dynamics_Robot_Dog_r870x580.jpg?3cf45c1fcd35d7c8fb5d78aa0a00113dd3c78408" alt="Robot" loading="lazy">
      <span class="cap">Robot</span>
    </button>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lb-btn lb-close" type="button" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
    <figure class="lb-figure">
      <img id="lb-img" src="" alt="">
      <figcaption>
        <span id="lb-caption"></span>
        <span id="lb-count"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
